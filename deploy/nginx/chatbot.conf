# Chatbot API. Installed as /etc/nginx/snippets/chatbot.conf and included from
# s3-assets.conf, so it lives in the same server block as the site.
#
# The widget (components/Chatbot.tsx) calls /chatbot-api/chat on the site's own
# origin; the Python service listens on localhost only. Only the two endpoints
# the widget needs are exposed. The service's /reindex, /docs and /routes are
# deliberately not reachable from the internet.
location = /chatbot-api/chat {
  limit_req zone=chatbot burst=8 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:8001/chat;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header Connection        "";
  proxy_buffering off;
  proxy_read_timeout 90s;
}

location = /chatbot-api/health {
  proxy_pass http://127.0.0.1:8001/health;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}
