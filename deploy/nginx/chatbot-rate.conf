# Rate limit for the chatbot. Installed as /etc/nginx/conf.d/chatbot-rate.conf
# (http context). Every chat message is a paid/quota-limited model call, so one
# visitor is held to 20 messages a minute (plus a small burst). Behind
# Cloudflare the real visitor address is in CF-Connecting-IP.
map $http_cf_connecting_ip $chatbot_client {
  default $http_cf_connecting_ip;
  ""      $remote_addr;
}
limit_req_zone $chatbot_client zone=chatbot:10m rate=20r/m;
